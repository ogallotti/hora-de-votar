<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("/fonts/archivo-800.woff2") format("woff2"); font-weight: 800; }
  html, body { margin: 0; background: transparent; }
  .i { width: 512px; height: 512px; display: grid; place-items: center; background: transparent; }
  .tecla {
    width: 472px; height: 472px; border-radius: 108px; background: #2fb36a; display: grid; place-items: center;
    box-shadow: inset 0 -34px 0 rgb(0 0 0 / .17), inset 0 12px 0 rgb(255 255 255 / .35);
    font: 800 380px/1 "Archivo", sans-serif; color: #07120b; letter-spacing: -.02em; padding-bottom: 30px; box-sizing: border-box;
  }
  /* ?cheio: quadro todo verde, sem transparência (o iOS arredonda e pinta de preto o que for transparente) */
  .cheio .tecla { width: 512px; height: 512px; border-radius: 0; }
</style></head>
<body><script>if (location.search.includes("cheio")) document.documentElement.classList.add("cheio");</script><div class="i"><div class="tecla">V</div></div></body></html>
