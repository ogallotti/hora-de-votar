<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("/fonts/archivo-800.woff2") format("woff2"); font-weight: 800; }
  html, body { margin: 0; background: transparent; }
  .i { width: 512px; height: 512px; display: grid; place-items: center; background: #ffffff; }
  .tecla {
    width: 400px; height: 400px; border-radius: 92px; background: #2fb36a; display: grid; place-items: center;
    box-shadow: inset 0 -30px 0 rgb(0 0 0 / .17), inset 0 10px 0 rgb(255 255 255 / .35);
    font: 800 330px/1 "Archivo", sans-serif; color: #07120b; letter-spacing: -.02em; padding-bottom: 30px; box-sizing: border-box;
  }
</style></head>
<body><div class="i"><div class="tecla">V</div></div></body></html>
