name: Deploy (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # modelo do 2º turno e recomendação de horário: não publica se a conta quebrar
      - run: node --test tests/*.test.mjs

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # functions/ (prévia de links e imagem por seção) usa @cf-wasm/og; o wrangler empacota junto
      - run: pnpm install --frozen-lockfile
      - name: Publicar public/ e functions/ no Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy public --project-name=hora-de-votar --branch=main
      # páginas de seção/local e o total de visitas ficam no cache da borda (regra de cache da zona): limpa a cada deploy,
      # só esses caminhos (as imagens de prévia já desenhadas ficam; mudam de URL quando VERSAO_IMG muda)
      - name: Limpar o cache da borda
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          Z=a21d43ba5a845a17455775c61635093a
          purga() { curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$Z/purge_cache" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$1"; }
          purga '{"prefixes":["horadevotar.com/s/","horadevotar.com/l/","horadevotar.com/api/total"]}' || purga '{"purge_everything":true}'
